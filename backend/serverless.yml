# yaml-language-server: $schema=https://json-schema.org/draft/2020-12/schema
service: nail-booking-backend
frameworkVersion: '3'
useDotenv: true

provider:
  name: aws
  runtime: nodejs20.x
  region: ${opt:region, 'eu-west-1'}
  stage: ${opt:stage, 'stage'}
  environment:
    APP_STAGE: ${sls:stage}
    TABLE_NAME: ${self:custom.tableName}
    JWT_SECRET: ${env:JWT_SECRET}
    SES_FROM_EMAIL: ${env:SES_FROM_EMAIL}
    MEDIA_BUCKET: ${self:custom.mediaBucket}
    IS_OFFLINE: ${env:IS_OFFLINE, ''}
    CORS_ORIGIN: ${env:CORS_ORIGIN, 'http://localhost:5173'}
    INSTAGRAM_ACCESS_TOKEN: ${env:INSTAGRAM_ACCESS_TOKEN, ''}
    INSTAGRAM_USER_ID: ${env:INSTAGRAM_USER_ID, 'me'}
    INSTAGRAM_API_VERSION: ${env:INSTAGRAM_API_VERSION, 'v23.0'}
    INSTAGRAM_SYNC_LIMIT: ${env:INSTAGRAM_SYNC_LIMIT, '24'}
    ENABLE_SMS: ${env:ENABLE_SMS, 'false'}
    TWILIO_ACCOUNT_SID: ${env:TWILIO_ACCOUNT_SID, ''}
    TWILIO_AUTH_TOKEN: ${env:TWILIO_AUTH_TOKEN, ''}
    TWILIO_FROM_PHONE: ${env:TWILIO_FROM_PHONE, ''}
    AWS_NODEJS_CONNECTION_REUSE_ENABLED: '1'
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:PutItem
            - dynamodb:GetItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
            - dynamodb:Query
            - dynamodb:Scan
            - dynamodb:TransactWriteItems
            - dynamodb:BatchWriteItem
          Resource:
            - Fn::GetAtt: [NailBookingTable, Arn]
            - Fn::Sub: '${NailBookingTable.Arn}/index/*'
        - Effect: Allow
          Action:
            - ses:SendEmail
            - ses:SendRawEmail
          Resource: '*'
        - Effect: Allow
          Action:
            - s3:GetObject
            - s3:ListBucket
          Resource:
            - Fn::GetAtt: [MediaBucket, Arn]
            - Fn::Sub: '${MediaBucket.Arn}/*'
  httpApi:
    cors:
      allowedOrigins:
        - ${env:CORS_ORIGIN, 'http://localhost:5173'}
      allowedHeaders:
        - Content-Type
        - Authorization
      allowedMethods:
        - GET
        - POST
        - PATCH
        - DELETE
        - OPTIONS
      allowCredentials: true
    authorizers:
      jwtAuthorizer:
        type: request
        functionName: authorizer
        enableSimpleResponses: true
        # Cookie-based auth (accessToken / adminAccessToken). Authorization Bearer still works inside the authorizer when present.
        identitySource: $request.header.Cookie

custom:
  tableName: NailBooking-${sls:stage}
  mediaBucket: ${env:MEDIA_BUCKET, 'nail-booking-media-local-${sls:stage}'}
  serverless-offline:
    httpPort: 4000
    noPrependStageInUrl: true
  esbuild:
    bundle: true
    minify: false
    sourcemap: true
    target: node20
    platform: node
    concurrency: 10

functions:
  authorizer:
    handler: src/handlers/authorizer.handler

  register:
    handler: src/handlers/register.handler
    events:
      - httpApi:
          path: /users
          method: POST

  login:
    handler: src/handlers/login.handler
    events:
      - httpApi:
          path: /login
          method: POST

  refresh:
    handler: src/handlers/refresh.handler
    events:
      - httpApi:
          path: /auth/refresh
          method: POST

  logout:
    handler: src/handlers/logout.handler
    events:
      - httpApi:
          path: /logout
          method: POST

  adminLogin:
    handler: src/handlers/adminLogin.handler
    events:
      - httpApi:
          path: /admin/login
          method: POST

  getSlots:
    handler: src/handlers/getSlots.handler
    events:
      - httpApi:
          path: /available-slots
          method: GET
          authorizer:
            name: jwtAuthorizer

  createBooking:
    handler: src/handlers/createBooking.handler
    events:
      - httpApi:
          path: /booking
          method: POST
          authorizer:
            name: jwtAuthorizer

  getBookingsByDate:
    handler: src/handlers/getBookingsByDate.handler
    events:
      - httpApi:
          path: /admin/bookings
          method: GET
          authorizer:
            name: jwtAuthorizer

  getMedia:
    handler: src/handlers/getMedia.handler
    events:
      - httpApi:
          path: /media
          method: GET

  adminSyncInstagramMedia:
    handler: src/handlers/adminSyncInstagramMedia.handler
    events:
      - httpApi:
          path: /admin/media/sync-instagram
          method: POST
          authorizer:
            name: jwtAuthorizer

  adminUpdateMedia:
    handler: src/handlers/adminUpdateMedia.handler
    events:
      - httpApi:
          path: /admin/media/{id}
          method: PATCH
          authorizer:
            name: jwtAuthorizer

  getAuditEvents:
    handler: src/handlers/getAuditEvents.handler
    events:
      - httpApi:
          path: /admin/audit-events
          method: GET
          authorizer:
            name: jwtAuthorizer

  getUsers:
    handler: src/handlers/getUsers.handler
    events:
      - httpApi:
          path: /users
          method: GET
          authorizer:
            name: jwtAuthorizer

  setUserRole:
    handler: src/handlers/setUserRole.handler
    events:
      - httpApi:
          path: /admin/users/{userId}/role
          method: PATCH
          authorizer:
            name: jwtAuthorizer

  getMyBookings:
    handler: src/handlers/getMyBookings.handler
    events:
      - httpApi:
          path: /my-bookings
          method: GET
          authorizer:
            name: jwtAuthorizer

  cancelBooking:
    handler: src/handlers/cancelBooking.handler
    events:
      - httpApi:
          path: /cancel-booking
          method: POST
          authorizer:
            name: jwtAuthorizer

  getMe:
    handler: src/handlers/getMe.handler
    events:
      - httpApi:
          path: /me
          method: GET
          authorizer:
            name: jwtAuthorizer

  updateMe:
    handler: src/handlers/updateMe.handler
    events:
      - httpApi:
          path: /me
          method: PATCH
          authorizer:
            name: jwtAuthorizer

  adminGenerateSlots:
    handler: src/handlers/adminGenerateSlots.handler
    events:
      - httpApi:
          path: /admin/slots
          method: POST
          authorizer:
            name: jwtAuthorizer

  adminDeleteSlot:
    handler: src/handlers/adminDeleteSlot.handler
    events:
      - httpApi:
          path: /admin/slots
          method: DELETE
          authorizer:
            name: jwtAuthorizer

  adminUpdateSlot:
    handler: src/handlers/adminUpdateSlot.handler
    events:
      - httpApi:
          path: /admin/slots
          method: PATCH
          authorizer:
            name: jwtAuthorizer

  adminModifyBooking:
    handler: src/handlers/adminModifyBooking.handler
    events:
      - httpApi:
          path: /admin/bookings/{bookingId}
          method: PATCH
          authorizer:
            name: jwtAuthorizer

  reminder:
    handler: src/handlers/reminder.handler
    events:
      - schedule: cron(0 9 * * ? *)

resources:
  Resources:
    NailBookingTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:custom.tableName}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: PK
            AttributeType: S
          - AttributeName: SK
            AttributeType: S
          - AttributeName: email
            AttributeType: S
          - AttributeName: bookingDate
            AttributeType: S
          - AttributeName: bookingTimeSlot
            AttributeType: S
        KeySchema:
          - AttributeName: PK
            KeyType: HASH
          - AttributeName: SK
            KeyType: RANGE
        GlobalSecondaryIndexes:
          - IndexName: EmailIndex
            KeySchema:
              - AttributeName: email
                KeyType: HASH
            Projection:
              ProjectionType: ALL
          - IndexName: BookingByDate
            KeySchema:
              - AttributeName: bookingDate
                KeyType: HASH
              - AttributeName: bookingTimeSlot
                KeyType: RANGE
            Projection:
              ProjectionType: ALL

    MediaBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: ${self:custom.mediaBucket}
        CorsConfiguration:
          CorsRules:
            - AllowedOrigins:
                - ${env:CORS_ORIGIN, 'http://localhost:5173'}
              AllowedMethods:
                - GET
                - HEAD
              AllowedHeaders:
                - '*'

plugins:
  - serverless-esbuild
  - serverless-offline
