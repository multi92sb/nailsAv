# yaml-language-server: $schema=https://json-schema.org/draft/2020-12/schema
service: nail-booking-backend
frameworkVersion: '3'
useDotenv: true

provider:
  name: aws
  runtime: nodejs20.x
  region: ${opt:region, 'eu-west-1'}
  stage: ${opt:stage, 'stage'}
  environment:
    APP_STAGE: ${sls:stage}
    TABLE_NAME: ${self:custom.tableName}
    JWT_SECRET: ${env:JWT_SECRET}
    SES_FROM_EMAIL: ${env:SES_FROM_EMAIL}
    MEDIA_BUCKET: ${self:custom.mediaBucket}
    CORS_ORIGIN: ${env:CORS_ORIGIN, 'http://localhost:5173'}
    INSTAGRAM_ACCESS_TOKEN: ${env:INSTAGRAM_ACCESS_TOKEN, ''}
    INSTAGRAM_USER_ID: ${env:INSTAGRAM_USER_ID, 'me'}
    INSTAGRAM_API_VERSION: ${env:INSTAGRAM_API_VERSION, 'v23.0'}
    INSTAGRAM_SYNC_LIMIT: ${env:INSTAGRAM_SYNC_LIMIT, '24'}
    ENABLE_SMS: ${env:ENABLE_SMS, 'false'}
    TWILIO_ACCOUNT_SID: ${env:TWILIO_ACCOUNT_SID, ''}
    TWILIO_AUTH_TOKEN: ${env:TWILIO_AUTH_TOKEN, ''}
    TWILIO_FROM_PHONE: ${env:TWILIO_FROM_PHONE, ''}
    AWS_NODEJS_CONNECTION_REUSE_ENABLED: '1'
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:PutItem
            - dynamodb:GetItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
            - dynamodb:Query
            - dynamodb:Scan
            - dynamodb:TransactWriteItems
            - dynamodb:BatchWriteItem
          Resource:
            - Fn::GetAtt: [NailBookingTable, Arn]
            - Fn::Sub: '${NailBookingTable.Arn}/index/*'
        - Effect: Allow
          Action:
            - ses:SendEmail
            - ses:SendRawEmail
          Resource: '*'
        - Effect: Allow
          Action:
            - s3:GetObject
            - s3:ListBucket
          Resource:
            - Fn::GetAtt: [MediaBucket, Arn]
            - Fn::Sub: '${MediaBucket.Arn}/*'
        # Log group ARN without the ':*' suffix that Serverless v3 generates
        - Effect: Allow
          Action:
            - logs:CreateLogGroup
            - logs:TagResource
          Resource:
            - Fn::Sub: 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${self:service}-${sls:stage}-*'
  httpApi:
    cors:
      allowedOrigins:
        - ${env:CORS_ORIGIN, 'http://localhost:5173'}
      allowedHeaders:
        - Content-Type
        - Authorization
      allowedMethods:
        - GET
        - POST
        - PATCH
        - DELETE
        - OPTIONS
      allowCredentials: true
    authorizers:
      jwtAuthorizer:
        type: request
        functionName: authorizer
        enableSimpleResponses: true
        # Cookie-based auth (accessToken / adminAccessToken). Authorization Bearer still works inside the authorizer when present.
        identitySource: $request.header.Cookie

custom:
  tableName: NailBooking-${sls:stage}
  mediaBucket: ${env:MEDIA_BUCKET, 'nail-booking-media-local-${sls:stage}'}
  frontendDomain: ${env:FRONTEND_DOMAIN, 'nailsav.podinario.rs'}
  frontendBucket: ${env:FRONTEND_BUCKET, 'nail-booking-frontend-${sls:stage}'}
  certificateArn: ${env:CERTIFICATE_ARN, 'arn:aws:acm:us-east-1:000000000000:certificate/00000000-0000-0000-0000-000000000000'}
  serverless-offline:
    httpPort: 4000
    noPrependStageInUrl: true
  esbuild:
    bundle: true
    minify: false
    sourcemap: true
    target: node20
    platform: node
    concurrency: 10

functions:
  authorizer:
    handler: src/handlers/authorizer.handler

  register:
    handler: src/handlers/register.handler
    events:
      - httpApi:
          path: /users
          method: POST

  login:
    handler: src/handlers/login.handler
    events:
      - httpApi:
          path: /login
          method: POST

  refresh:
    handler: src/handlers/refresh.handler
    events:
      - httpApi:
          path: /auth/refresh
          method: POST

  logout:
    handler: src/handlers/logout.handler
    events:
      - httpApi:
          path: /logout
          method: POST

  adminLogin:
    handler: src/handlers/adminLogin.handler
    events:
      - httpApi:
          path: /admin/login
          method: POST

  getSlots:
    handler: src/handlers/getSlots.handler
    events:
      - httpApi:
          path: /available-slots
          method: GET
          authorizer:
            name: jwtAuthorizer

  createBooking:
    handler: src/handlers/createBooking.handler
    events:
      - httpApi:
          path: /booking
          method: POST
          authorizer:
            name: jwtAuthorizer

  getBookingsByDate:
    handler: src/handlers/getBookingsByDate.handler
    events:
      - httpApi:
          path: /admin/bookings
          method: GET
          authorizer:
            name: jwtAuthorizer

  getMedia:
    handler: src/handlers/getMedia.handler
    events:
      - httpApi:
          path: /media
          method: GET

  adminSyncInstagramMedia:
    handler: src/handlers/adminSyncInstagramMedia.handler
    events:
      - httpApi:
          path: /admin/media/sync-instagram
          method: POST
          authorizer:
            name: jwtAuthorizer

  adminUpdateMedia:
    handler: src/handlers/adminUpdateMedia.handler
    events:
      - httpApi:
          path: /admin/media/{id}
          method: PATCH
          authorizer:
            name: jwtAuthorizer

  getAuditEvents:
    handler: src/handlers/getAuditEvents.handler
    events:
      - httpApi:
          path: /admin/audit-events
          method: GET
          authorizer:
            name: jwtAuthorizer

  getUsers:
    handler: src/handlers/getUsers.handler
    events:
      - httpApi:
          path: /users
          method: GET
          authorizer:
            name: jwtAuthorizer

  setUserRole:
    handler: src/handlers/setUserRole.handler
    events:
      - httpApi:
          path: /admin/users/{userId}/role
          method: PATCH
          authorizer:
            name: jwtAuthorizer

  getMyBookings:
    handler: src/handlers/getMyBookings.handler
    events:
      - httpApi:
          path: /my-bookings
          method: GET
          authorizer:
            name: jwtAuthorizer

  cancelBooking:
    handler: src/handlers/cancelBooking.handler
    events:
      - httpApi:
          path: /cancel-booking
          method: POST
          authorizer:
            name: jwtAuthorizer

  getMe:
    handler: src/handlers/getMe.handler
    events:
      - httpApi:
          path: /me
          method: GET
          authorizer:
            name: jwtAuthorizer

  updateMe:
    handler: src/handlers/updateMe.handler
    events:
      - httpApi:
          path: /me
          method: PATCH
          authorizer:
            name: jwtAuthorizer

  getLoyalty:
    handler: src/handlers/getLoyalty.handler
    events:
      - httpApi:
          path: /loyalty
          method: GET
          authorizer:
            name: jwtAuthorizer

  adminRedeemLoyalty:
    handler: src/handlers/adminRedeemLoyalty.handler
    events:
      - httpApi:
          path: /admin/loyalty/redeem
          method: POST
          authorizer:
            name: jwtAuthorizer

  adminGenerateSlots:
    handler: src/handlers/adminGenerateSlots.handler
    events:
      - httpApi:
          path: /admin/slots
          method: POST
          authorizer:
            name: jwtAuthorizer

  adminDeleteSlot:
    handler: src/handlers/adminDeleteSlot.handler
    events:
      - httpApi:
          path: /admin/slots
          method: DELETE
          authorizer:
            name: jwtAuthorizer

  adminUpdateSlot:
    handler: src/handlers/adminUpdateSlot.handler
    events:
      - httpApi:
          path: /admin/slots
          method: PATCH
          authorizer:
            name: jwtAuthorizer

  adminModifyBooking:
    handler: src/handlers/adminModifyBooking.handler
    events:
      - httpApi:
          path: /admin/bookings/{bookingId}
          method: PATCH
          authorizer:
            name: jwtAuthorizer

  reminder:
    handler: src/handlers/reminder.handler
    events:
      - schedule: cron(0 9 * * ? *)

resources:
  Conditions:
    IsProd: !Equals ['${sls:stage}', 'prod']

  Resources:
    NailBookingTable:
      Type: AWS::DynamoDB::Table
      # Bookings and user accounts must survive a stack teardown.
      DeletionPolicy: Retain
      UpdateReplacePolicy: Retain
      Properties:
        TableName: ${self:custom.tableName}
        BillingMode: PAY_PER_REQUEST
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true
        AttributeDefinitions:
          - AttributeName: PK
            AttributeType: S
          - AttributeName: SK
            AttributeType: S
          - AttributeName: email
            AttributeType: S
          - AttributeName: bookingDate
            AttributeType: S
          - AttributeName: bookingTimeSlot
            AttributeType: S
        KeySchema:
          - AttributeName: PK
            KeyType: HASH
          - AttributeName: SK
            KeyType: RANGE
        GlobalSecondaryIndexes:
          - IndexName: EmailIndex
            KeySchema:
              - AttributeName: email
                KeyType: HASH
            Projection:
              ProjectionType: ALL
          - IndexName: BookingByDate
            KeySchema:
              - AttributeName: bookingDate
                KeyType: HASH
              - AttributeName: bookingTimeSlot
                KeyType: RANGE
            Projection:
              ProjectionType: ALL

    MediaBucket:
      Type: AWS::S3::Bucket
      DeletionPolicy: Retain
      UpdateReplacePolicy: Retain
      Properties:
        BucketName: ${self:custom.mediaBucket}
        # Gallery images are served through presigned URLs, never public reads.
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true
        CorsConfiguration:
          CorsRules:
            - AllowedOrigins:
                - ${env:CORS_ORIGIN, 'http://localhost:5173'}
              AllowedMethods:
                - GET
                - HEAD
              AllowedHeaders:
                - '*'

    # Production-only static site. CloudFront serves the SPA and proxies /api/* to API Gateway
    # so cookies stay first-party and the browser never talks to the API Gateway URL directly.
    FrontendBucket:
      Type: AWS::S3::Bucket
      Condition: IsProd
      Properties:
        BucketName: ${self:custom.frontendBucket}
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true
        OwnershipControls:
          Rules:
            - ObjectOwnership: BucketOwnerEnforced

    FrontendOriginAccessControl:
      Type: AWS::CloudFront::OriginAccessControl
      Condition: IsProd
      Properties:
        OriginAccessControlConfig:
          Name: nailsav-frontend-oac-${sls:stage}
          Description: Private access to the NailsAv frontend bucket
          OriginAccessControlOriginType: s3
          SigningBehavior: always
          SigningProtocol: sigv4

    FrontendBucketPolicy:
      Type: AWS::S3::BucketPolicy
      Condition: IsProd
      Properties:
        Bucket: !Ref FrontendBucket
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Sid: AllowCloudFrontRead
              Effect: Allow
              Principal:
                Service: cloudfront.amazonaws.com
              Action: s3:GetObject
              Resource: !Sub '${FrontendBucket.Arn}/*'
              Condition:
                StringEquals:
                  AWS:SourceArn: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${FrontendDistribution}'

    FrontendCachePolicy:
      Type: AWS::CloudFront::CachePolicy
      Condition: IsProd
      Properties:
        CachePolicyConfig:
          Name: nailsav-frontend-${sls:stage}
          Comment: Cache content-hashed frontend assets; deploys invalidate the distribution.
          DefaultTTL: 3600
          MaxTTL: 31536000
          MinTTL: 0
          ParametersInCacheKeyAndForwardedToOrigin:
            EnableAcceptEncodingBrotli: true
            EnableAcceptEncodingGzip: true
            CookiesConfig:
              CookieBehavior: none
            HeadersConfig:
              HeaderBehavior: none
            QueryStringsConfig:
              QueryStringBehavior: none

    ApiCachePolicy:
      Type: AWS::CloudFront::CachePolicy
      Condition: IsProd
      Properties:
        CachePolicyConfig:
          Name: nailsav-api-no-cache-${sls:stage}
          Comment: API responses depend on cookies and must never be cached.
          DefaultTTL: 0
          MaxTTL: 0
          MinTTL: 0
          ParametersInCacheKeyAndForwardedToOrigin:
            EnableAcceptEncodingBrotli: false
            EnableAcceptEncodingGzip: false
            CookiesConfig:
              CookieBehavior: none
            HeadersConfig:
              HeaderBehavior: none
            QueryStringsConfig:
              QueryStringBehavior: none

    ApiOriginRequestPolicy:
      Type: AWS::CloudFront::OriginRequestPolicy
      Condition: IsProd
      Properties:
        OriginRequestPolicyConfig:
          Name: nailsav-api-forward-all-${sls:stage}
          Comment: Forward cookies, headers and query strings to API Gateway, except Host.
          CookiesConfig:
            CookieBehavior: all
          HeadersConfig:
            HeaderBehavior: allExcept
            Headers:
              - Host
          QueryStringsConfig:
            QueryStringBehavior: all

    SpaRewriteFunction:
      Type: AWS::CloudFront::Function
      Condition: IsProd
      Properties:
        Name: nailsav-spa-rewrite-${sls:stage}
        AutoPublish: true
        FunctionConfig:
          Comment: Serve index.html for client-side routes.
          Runtime: cloudfront-js-2.0
        FunctionCode: |
          function handler(event) {
            var request = event.request;
            var uri = request.uri;

            if (uri.endsWith('/')) {
              request.uri += 'index.html';
            } else if (!uri.includes('.')) {
              request.uri = '/index.html';
            }

            return request;
          }

    StripApiPrefixFunction:
      Type: AWS::CloudFront::Function
      Condition: IsProd
      Properties:
        Name: nailsav-strip-api-prefix-${sls:stage}
        AutoPublish: true
        FunctionConfig:
          Comment: Remove the /api prefix before forwarding to API Gateway.
          Runtime: cloudfront-js-2.0
        FunctionCode: |
          function handler(event) {
            var request = event.request;
            var uri = request.uri;

            if (uri === '/api') {
              request.uri = '/';
            } else if (uri.startsWith('/api/')) {
              request.uri = uri.slice(4);
            }

            return request;
          }

    FrontendDistribution:
      Type: AWS::CloudFront::Distribution
      Condition: IsProd
      Properties:
        DistributionConfig:
          Comment: NailsAv frontend and API
          Enabled: true
          HttpVersion: http2and3
          IPV6Enabled: true
          PriceClass: PriceClass_100
          DefaultRootObject: index.html
          Aliases:
            - ${self:custom.frontendDomain}
          ViewerCertificate:
            AcmCertificateArn: ${self:custom.certificateArn}
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          Origins:
            - Id: FrontendS3
              DomainName: !GetAtt FrontendBucket.RegionalDomainName
              OriginAccessControlId: !GetAtt FrontendOriginAccessControl.Id
              S3OriginConfig:
                OriginAccessIdentity: ''
            - Id: ApiGateway
              DomainName: !Join
                - '.'
                - - !Ref HttpApi
                  - execute-api
                  - !Ref 'AWS::Region'
                  - !Ref 'AWS::URLSuffix'
              CustomOriginConfig:
                OriginProtocolPolicy: https-only
                OriginSSLProtocols:
                  - TLSv1.2
          DefaultCacheBehavior:
            TargetOriginId: FrontendS3
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
            CachedMethods:
              - GET
              - HEAD
              - OPTIONS
            Compress: true
            CachePolicyId: !Ref FrontendCachePolicy
            FunctionAssociations:
              - EventType: viewer-request
                FunctionARN: !GetAtt SpaRewriteFunction.FunctionMetadata.FunctionARN
          CacheBehaviors:
            - PathPattern: /api/*
              TargetOriginId: ApiGateway
              ViewerProtocolPolicy: redirect-to-https
              AllowedMethods:
                - GET
                - HEAD
                - OPTIONS
                - PUT
                - POST
                - PATCH
                - DELETE
              CachedMethods:
                - GET
                - HEAD
                - OPTIONS
              Compress: false
              CachePolicyId: !Ref ApiCachePolicy
              OriginRequestPolicyId: !Ref ApiOriginRequestPolicy
              FunctionAssociations:
                - EventType: viewer-request
                  FunctionARN: !GetAtt StripApiPrefixFunction.FunctionMetadata.FunctionARN

  Outputs:
    FrontendBucketName:
      Condition: IsProd
      Value: !Ref FrontendBucket
    FrontendDistributionId:
      Condition: IsProd
      Value: !Ref FrontendDistribution
    FrontendDistributionDomain:
      Condition: IsProd
      Value: !GetAtt FrontendDistribution.DomainName
    FrontendUrl:
      Condition: IsProd
      Value: !Sub 'https://${self:custom.frontendDomain}'

plugins:
  - serverless-esbuild
  - serverless-offline
